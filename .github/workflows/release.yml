name: Release

# Push a tag such as v0.1.0 to build Linux binaries and attach them, with SHA256SUMS, to the
# GitHub release of that tag (created if missing), with the dist the team's server hands out to
# the clients (docs/update.md): the pi and Hermes archives, manifest.json, its signature
# manifest.sig, and all of it in relevo-dist-<version>.tar.gz. The manifest is signed with the
# Ed25519 key in the repository secret RELEVO_SIGNING_KEY (PEM); the release stops if that key
# is not the one keys/release-signing-pub.pem holds, which the binaries trust.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Native runners, no cross-compiling. Built on Ubuntu 22.04 so the binaries need only
          # glibc 2.35, and so run on Debian 12, Ubuntu 22.04 and later, and DGX OS. The arm64
          # runner is free for public repositories; a private one may need a plan that has it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/relevo dist/relevo-${{ matrix.target }}
          dist/relevo-${{ matrix.target }} --version
      - uses: actions/upload-artifact@v6
        with:
          name: relevo-${{ matrix.target }}
          path: dist/relevo-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Dist, signed
        env:
          RELEVO_SIGNING_KEY: ${{ secrets.RELEVO_SIGNING_KEY }}
        run: |
          [ -n "$RELEVO_SIGNING_KEY" ] || { echo "the secret RELEVO_SIGNING_KEY is not set" >&2; exit 1; }
          key=$(mktemp "$RUNNER_TEMP/signing.XXXXXX")
          trap 'rm -f "$key"' EXIT
          chmod 0600 "$key"
          printf '%s\n' "$RELEVO_SIGNING_KEY" > "$key"
          deploy/make-dist.sh --key "$key" --pub keys/release-signing-pub.pem dist
          cat dist/manifest.json
      # Of the binaries and of every archive.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum relevo-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/relevo-* dist/SHA256SUMS \
            dist/manifest.json dist/manifest.sig
