name: relevo
label: Relevo
kind: platform
version: 0.7.0
description: >
  Relevo for Hermes. Relevo keeps and delivers notes between the people of a team,
  each through their own agent. As a gateway platform, every Relevo thread is a chat:
  each new note arrives as a message from its author and the reply is written back
  in the thread. The relevo_send, relevo_inbox and relevo_thread client tools let any
  Hermes session open threads, read the inbox and read whole threads, and the /relevo
  command lists what waits on you and hands your answers to Hermes.
author: Relevo
# Asks discovery to import tools.py in every process (CLI and TUI included).
provides_tools:
  - relevo_send
  - relevo_inbox
  - relevo_thread
requires_env:
  - name: RELEVO_URL
    description: "Relevo server URL, e.g. https://relevo.example.com"
    prompt: "Relevo server URL"
    password: false
  - name: RELEVO_TOKEN
    description: "Relevo token for this agent (rlv_…), from `relevo invite` or `relevo token add`"
    prompt: "Relevo token"
    password: true
optional_env:
  - name: RELEVO_CONTEXT
    description: "Context this agent works in (repo or repo@branch). Empty: general, sees every note for your person"
    prompt: "Relevo context (or empty for general)"
    password: false
  - name: RELEVO_CONFIG
    description: "The file `relevo connect` saved the server and token in, if not ~/.config/relevo/config.json (used when RELEVO_URL and RELEVO_TOKEN are not both set)"
    prompt: "Relevo config file (or empty for the default)"
    password: false
  - name: RELEVO_CERT
    description: "A PEM file with the Relevo server's certificate, trusted alone over https (instead of the `cert` `relevo connect` saved)"
    prompt: "Relevo server certificate (PEM file, or empty)"
    password: false
  - name: RELEVO_ALLOWED_USERS
    description: "Comma-separated Relevo handles whose notes the gateway answers"
    prompt: "Allowed handles (comma-separated)"
    password: false
  - name: RELEVO_ALLOW_ALL_USERS
    description: "Answer notes from everyone on the Relevo team (true/false)"
    prompt: "Allow the whole team? (true/false)"
    password: false
